<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Arcade Snake</title>
  <meta name="description" content="A dark modern arcade Snake game built with HTML5 Canvas, Web Audio API, and zero external dependencies.">
  <meta property="og:title" content="Neon Arcade Snake">
  <meta property="og:description" content="A dark modern arcade Snake game built with HTML5 Canvas, Web Audio API, and zero external dependencies.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg-color: #080b14;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border-color: rgba(30, 41, 59, 0.8);
      --neon-green: #00ff88;
      --neon-cyan: #00e5ff;
      --neon-pink: #ff2a6d;
      --neon-amber: #ffb703;
      --neon-red: #ff3366;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 25%, #131d36 0%, #080b14 75%);
    }

    /* Ambient background grid pattern */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* App Container */
    .game-shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      height: 100%;
      max-height: 940px;
      padding: 12px 16px;
      justify-content: space-between;
    }

    /* Top HUD */
    .game-hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      margin-bottom: 10px;
    }

    .hud-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hud-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .hud-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .hud-value.score {
      color: var(--neon-green);
      text-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
    }

    .hud-value.high-score {
      color: var(--neon-amber);
      text-shadow: 0 0 12px rgba(255, 183, 3, 0.4);
    }

    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.25);
      color: var(--neon-cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }

    .hud-btn:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(148, 163, 184, 0.4);
      transform: translateY(-1px);
    }

    .hud-btn:active {
      transform: translateY(1px);
    }

    .hud-btn svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Canvas Stage Container */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      padding: 4px;
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 229, 255, 0.05) 50%, rgba(255, 42, 109, 0.2));
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 255, 136, 0.06);
      transition: box-shadow 0.2s ease;
    }

    .canvas-wrapper.hit-flash {
      box-shadow: 0 0 50px rgba(255, 42, 109, 0.8), 0 0 80px rgba(255, 51, 102, 0.5);
      animation: screen-shake 0.3s ease-out;
    }

    @keyframes screen-shake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 4px); }
      40% { transform: translate(6px, -4px); }
      60% { transform: translate(-4px, -2px); }
      80% { transform: translate(3px, 2px); }
      100% { transform: translate(0, 0); }
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      border-radius: 12px;
      image-rendering: pixelated;
    }

    /* Modal / Screen Overlays */
    .overlay {
      position: absolute;
      inset: 4px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: rgba(8, 11, 20, 0.9);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Title Screen Content */
    .title-logo-svg {
      width: 100%;
      max-width: 280px;
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 16px rgba(0, 255, 136, 0.35));
    }

    .title-subtitle {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      margin-bottom: 24px;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 32px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #080b14;
      background: linear-gradient(135deg, #00ff88, #00e5ff);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
      transition: all 0.15s ease;
      outline: none;
    }

    .primary-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 26px rgba(0, 255, 136, 0.6);
    }

    .primary-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      box-shadow: none;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(148, 163, 184, 0.4);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .title-prompt {
      margin-top: 18px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      animation: pulse-slow 1.6s infinite ease-in-out;
    }

    @keyframes pulse-slow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Game Over Modal Elements */
    .gameover-title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--neon-red);
      text-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
      margin-bottom: 16px;
    }

    .stats-card {
      width: 100%;
      max-width: 280px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .stats-row .label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .stats-row .val {
      font-family: ui-monospace, monospace;
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .new-record-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--neon-amber);
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid rgba(255, 183, 3, 0.4);
      border-radius: 4px;
      padding: 2px 6px;
      margin-top: 4px;
      animation: pulse-slow 1s infinite ease-in-out;
    }

    /* Pause Modal Elements */
    .pause-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      text-shadow: 0 0 16px rgba(0, 229, 255, 0.5);
      margin-bottom: 20px;
    }

    /* Bottom Section: Controls & D-Pad */
    .bottom-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      gap: 8px;
    }

    /* Keyboard legend */
    .controls-hint {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .kbd {
      display: inline-block;
      padding: 2px 5px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      font-weight: 600;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(71, 85, 105, 0.6);
      border-radius: 4px;
      color: #e2e8f0;
    }

    /* On-Screen Virtual Touch D-Pad */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 48px);
      gap: 8px;
      margin-top: 4px;
      justify-content: center;
      align-items: center;
    }

    .dpad-btn {
      width: 52px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 10px;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
      touch-action: none;
      transition: all 0.1s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
    }

    .dpad-btn:active, .dpad-btn.pressed {
      background: rgba(0, 255, 136, 0.25);
      border-color: var(--neon-green);
      color: var(--neon-green);
      transform: scale(0.94);
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
    }

    .dpad-btn.btn-up { grid-column: 2; grid-row: 1; }
    .dpad-btn.btn-left { grid-column: 1; grid-row: 2; }
    .dpad-btn.btn-down { grid-column: 2; grid-row: 2; }
    .dpad-btn.btn-right { grid-column: 3; grid-row: 2; }

    .dpad-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Viewport adjustments for small screens */
    @media (max-height: 700px) {
      .game-shell {
        padding: 6px 12px;
      }
      .game-hud {
        padding: 6px 12px;
        margin-bottom: 6px;
      }
      .hud-value {
        font-size: 18px;
      }
      .dpad-container {
        grid-template-columns: repeat(3, 46px);
        grid-template-rows: repeat(2, 42px);
        gap: 6px;
      }
      .dpad-btn {
        width: 46px;
        height: 42px;
      }
      .title-logo-svg {
        max-width: 220px;
        margin-bottom: 8px;
      }
      .title-subtitle {
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body data-state="title">
  <div class="bg-grid"></div>

  <main class="game-shell">
    <!-- Top HUD -->
    <header class="game-hud" aria-label="Game HUD">
      <div class="hud-stat">
        <span class="hud-label">Score</span>
        <span id="score-display" class="hud-value score">0</span>
      </div>

      <div class="hud-stat" style="align-items: center;">
        <span class="hud-label">Level</span>
        <div id="level-badge" class="hud-badge">
          <span>LVL</span>
          <span id="level-display">1</span>
        </div>
      </div>

      <div class="hud-stat" style="align-items: flex-end;">
        <span class="hud-label">Best</span>
        <span id="highscore-display" class="hud-value high-score">0</span>
      </div>

      <div class="hud-actions">
        <button id="btn-sound" class="hud-btn" aria-label="Toggle Sound" title="Sound (M)">
          <svg id="icon-sound-on" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="icon-sound-off" viewBox="0 0 24 24" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <button id="btn-pause" class="hud-btn" aria-label="Pause Game" title="Pause (P)">
          <svg id="icon-pause" viewBox="0 0 24 24">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
          <svg id="icon-play" viewBox="0 0 24 24" style="display: none;">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>

        <button id="btn-restart" class="hud-btn" aria-label="Restart Game" title="Restart (R)">
          <svg viewBox="0 0 24 24">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Canvas Stage with Overlays -->
    <div id="canvas-container" class="canvas-wrapper">
      <canvas id="game-canvas" width="480" height="480" aria-label="Snake Game Board"></canvas>

      <!-- Start / Title Overlay -->
      <div id="title-overlay" class="overlay active">
        <!-- Bespoke Inline SVG Title Lockup -->
        <svg class="title-logo-svg" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00ff88" />
              <stop offset="50%" stop-color="#00e5ff" />
              <stop offset="100%" stop-color="#ff2a6d" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <path d="M 25 45 Q 40 20, 60 45 T 95 45" stroke="#00ff88" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glow)"/>
          <circle cx="100" cy="45" r="5" fill="#ff2a6d" filter="url(#glow)"/>
          <text x="165" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="4" fill="url(#neonGrad)" text-anchor="middle">NEON SNAKE</text>
          <text x="165" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="6" fill="#94a3b8" text-anchor="middle">ARCADE EDITION</text>
        </svg>

        <p class="title-subtitle">CLASSIC RETRO · MODERN JUICE</p>

        <button id="start-button" class="primary-btn" data-start="true">
          <span>Start Game</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>

        <p class="title-prompt">Press Space, Enter or Tap to Start</p>
      </div>

      <!-- Pause Overlay -->
      <div id="pause-overlay" class="overlay">
        <h2 class="pause-title">GAME PAUSED</h2>
        <button id="resume-button" class="primary-btn" data-action="resume">
          <span>Resume</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>
        <button id="pause-restart-button" class="primary-btn btn-secondary">
          <span>Restart Game</span>
        </button>
      </div>

      <!-- Game Over Overlay -->
      <div id="gameover-overlay" class="overlay">
        <h2 class="gameover-title">GAME OVER</h2>
        
        <div class="stats-card">
          <div class="stats-row">
            <span class="label">Final Score</span>
            <span id="final-score" class="val score">0</span>
          </div>
          <div class="stats-row">
            <span class="label">High Score</span>
            <span id="final-best" class="val high-score">0</span>
          </div>
          <div class="stats-row">
            <span class="label">Food Consumed</span>
            <span id="final-food" class="val">0</span>
          </div>
          <div class="stats-row">
            <span class="label">Max Level</span>
            <span id="final-level" class="val">1</span>
          </div>
          <div id="new-record-banner" class="new-record-tag" style="display: none;">
            ★ NEW HIGH SCORE RECORD! ★
          </div>
        </div>

        <button id="play-again-button" class="primary-btn" data-start="true">
          <span>Play Again</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Bottom Controls & Hints -->
    <footer class="bottom-section">
      <!-- Touch D-Pad for Mobile -->
      <nav class="dpad-container" aria-label="Touch Controls">
        <button id="dpad-up" class="dpad-btn btn-up" aria-label="Move Up">
          <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
        <button id="dpad-left" class="dpad-btn btn-left" aria-label="Move Left">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button id="dpad-down" class="dpad-btn btn-down" aria-label="Move Down">
          <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <button id="dpad-right" class="dpad-btn btn-right" aria-label="Move Right">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </nav>

      <!-- Keyboard control hints -->
      <div class="controls-hint">
        <span><span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> or <span class="kbd">Arrows</span> Move</span>
        <span>·</span>
        <span><span class="kbd">Space</span> / <span class="kbd">P</span> Pause</span>
        <span>·</span>
        <span><span class="kbd">M</span> Mute</span>
      </div>
    </footer>
  </main>

  <script>
    /**
     * NEON ARCADE SNAKE - Pure Vanilla JS Implementation
     * Features: HTML5 Canvas 60fps rendering, Web Audio API procedural synthesis,
     * input buffer queue, 180-degree turn guard, difficulty scaling, particle pool,
     * localStorage high score persistence, and responsive touch/swipe controls.
     */
    (function () {
      'use strict';

      // --- CONFIGURATION CONSTANTS ---
      const GRID_SIZE = 20; // 20x20 tiles
      const CANVAS_WIDTH = 480;
      const CANVAS_HEIGHT = 480;
      const TILE_SIZE = CANVAS_WIDTH / GRID_SIZE; // 24px per tile
      const BASE_TICK_MS = 140; // Initial speed
      const MIN_TICK_MS = 60; // Max speed clamp
      const SPEED_STEP_FOOD = 5; // Increase speed every 5 food items
      const SPEED_STEP_DECREASE = 10; // Decrease tick duration by 10ms
      const POINTS_PER_FOOD = 10;
      const STORAGE_KEY_HIGHSCORE = 'neon_snake_highscore';
      const STORAGE_KEY_MUTE = 'neon_snake_muted';

      // --- AUDIO SYNTHESIS (Web Audio API) ---
      let audioCtx = null;
      let isMuted = localStorage.getItem(STORAGE_KEY_MUTE) === 'true';

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playTone(freq, duration, type = 'sine', gainVal = 0.15, slideTo = null) {
        if (isMuted || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const now = audioCtx.currentTime;

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo !== null) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
          }

          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {
          // Audio errors silently ignored
        }
      }

      function playEatSound(isLevelUp = false) {
        initAudio();
        if (isLevelUp) {
          // Ascending major triad fanfare
          playTone(523.25, 0.1, 'sine', 0.2, 659.25);
          setTimeout(() => playTone(659.25, 0.12, 'sine', 0.22, 783.99), 90);
          setTimeout(() => playTone(783.99, 0.2, 'triangle', 0.25, 1046.5), 180);
        } else {
          // Snappy high neon chime
          playTone(587.33, 0.08, 'sine', 0.18, 880);
          setTimeout(() => playTone(880, 0.1, 'sine', 0.15, 1174.66), 40);
        }
      }

      function playGameOverSound() {
        initAudio();
        // Descending doom chord sequence
        playTone(329.63, 0.15, 'sawtooth', 0.18, 220);
        setTimeout(() => playTone(220, 0.2, 'sawtooth', 0.2, 146.83), 120);
        setTimeout(() => playTone(146.83, 0.35, 'triangle', 0.25, 65.41), 260);
      }

      function playTickSound() {
        initAudio();
        // Subtle soft tap
        playTone(380, 0.03, 'sine', 0.04, 280);
      }

      // --- DOM REFERENCES ---
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const canvasContainer = document.getElementById('canvas-container');

      const scoreDisplay = document.getElementById('score-display');
      const highscoreDisplay = document.getElementById('highscore-display');
      const levelDisplay = document.getElementById('level-display');

      const titleOverlay = document.getElementById('title-overlay');
      const pauseOverlay = document.getElementById('pause-overlay');
      const gameoverOverlay = document.getElementById('gameover-overlay');

      const startButton = document.getElementById('start-button');
      const resumeButton = document.getElementById('resume-button');
      const pauseRestartButton = document.getElementById('pause-restart-button');
      const playAgainButton = document.getElementById('play-again-button');

      const btnSound = document.getElementById('btn-sound');
      const iconSoundOn = document.getElementById('icon-sound-on');
      const iconSoundOff = document.getElementById('icon-sound-off');

      const btnPause = document.getElementById('btn-pause');
      const iconPause = document.getElementById('icon-pause');
      const iconPlay = document.getElementById('icon-play');

      const btnRestart = document.getElementById('btn-restart');

      const finalScoreEl = document.getElementById('final-score');
      const finalBestEl = document.getElementById('final-best');
      const finalFoodEl = document.getElementById('final-food');
      const finalLevelEl = document.getElementById('final-level');
      const newRecordBanner = document.getElementById('new-record-banner');

      // --- PARTICLE SYSTEM (Zero-GC Pre-allocated Pool) ---
      const MAX_PARTICLES = 40;
      const particlePool = [];
      for (let i = 0; i < MAX_PARTICLES; i++) {
        particlePool.push({
          active: false,
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          size: 0,
          color: '#00ff88',
          life: 0,
          maxLife: 1
        });
      }

      function spawnParticles(tileX, tileY, color) {
        const originX = (tileX + 0.5) * TILE_SIZE;
        const originY = (tileY + 0.5) * TILE_SIZE;
        let spawned = 0;

        for (let i = 0; i < MAX_PARTICLES && spawned < 16; i++) {
          const p = particlePool[i];
          if (!p.active) {
            p.active = true;
            p.x = originX;
            p.y = originY;
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.2 + Math.random() * 3.5;
            p.vx = Math.cos(angle) * speed;
            p.vy = Math.sin(angle) * speed;
            p.size = 2.5 + Math.random() * 3.5;
            p.color = color;
            p.life = 0;
            p.maxLife = 20 + Math.floor(Math.random() * 20);
            spawned++;
          }
        }
      }

      function updateAndDrawParticles() {
        for (let i = 0; i < MAX_PARTICLES; i++) {
          const p = particlePool[i];
          if (p.active) {
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.95;
            p.vy *= 0.95;
            p.life++;

            const progress = p.life / p.maxLife;
            const alpha = Math.max(0, 1 - progress);
            const currentSize = p.size * (1 - progress * 0.5);

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(0.5, currentSize), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (p.life >= p.maxLife) {
              p.active = false;
            }
          }
        }
      }

      // --- GAME STATE ---
      let gameState = 'title'; // 'title' | 'playing' | 'paused' | 'gameover'
      let snake = [];
      let currentDirection = 'RIGHT';
      let inputQueue = []; // Input buffer queue to prevent 180 reverses
      let food = { x: 15, y: 10 };
      let score = 0;
      let foodEaten = 0;
      let currentLevel = 1;
      let tickIntervalMs = BASE_TICK_MS;
      let lastTickTime = 0;
      let isNewRecord = false;
      let highScore = parseInt(localStorage.getItem(STORAGE_KEY_HIGHSCORE) || '0', 10);
      if (isNaN(highScore)) highScore = 0;

      // Pulse and visual animation timers
      let pulseAngle = 0;
      let tongueTick = 0;

      function updateSoundUI() {
        if (isMuted) {
          iconSoundOn.style.display = 'none';
          iconSoundOff.style.display = 'block';
        } else {
          iconSoundOn.style.display = 'block';
          iconSoundOff.style.display = 'none';
        }
      }
      updateSoundUI();
      highscoreDisplay.textContent = highScore.toString();

      function toggleSound() {
        isMuted = !isMuted;
        localStorage.setItem(STORAGE_KEY_MUTE, isMuted ? 'true' : 'false');
        updateSoundUI();
        if (!isMuted) initAudio();
      }

      function setState(newState) {
        gameState = newState;
        document.body.dataset.state = newState;

        titleOverlay.classList.toggle('active', newState === 'title');
        pauseOverlay.classList.toggle('active', newState === 'paused');
        gameoverOverlay.classList.toggle('active', newState === 'gameover');

        // Update HUD buttons
        if (newState === 'playing') {
          iconPause.style.display = 'block';
          iconPlay.style.display = 'none';
        } else if (newState === 'paused') {
          iconPause.style.display = 'none';
          iconPlay.style.display = 'block';
        }

        // Clean blur of active button to avoid Space/Enter key hijacking
        if (document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }
      }

      function initSnake() {
        snake = [
          { x: 5, y: 10 },
          { x: 4, y: 10 },
          { x: 3, y: 10 }
        ];
        currentDirection = 'RIGHT';
        inputQueue = [];
      }

      function spawnFood() {
        const occupied = new Set();
        for (let i = 0; i < snake.length; i++) {
          occupied.add(`${snake[i].x},${snake[i].y}`);
        }

        const freeCells = [];
        for (let x = 0; x < GRID_SIZE; x++) {
          for (let y = 0; y < GRID_SIZE; y++) {
            if (!occupied.has(`${x},${y}`)) {
              freeCells.push({ x, y });
            }
          }
        }

        if (freeCells.length === 0) {
          // Board is full (win condition)
          triggerGameOver();
          return;
        }

        const chosen = freeCells[Math.floor(Math.random() * freeCells.length)];
        food = { x: chosen.x, y: chosen.y };
      }

      function calculateCurrentSpeed(foodCount) {
        const levels = Math.floor(foodCount / SPEED_STEP_FOOD);
        currentLevel = levels + 1;
        levelDisplay.textContent = currentLevel.toString();
        return Math.max(MIN_TICK_MS, BASE_TICK_MS - levels * SPEED_STEP_DECREASE);
      }

      function startNewGame() {
        initAudio();
        initSnake();
        score = 0;
        foodEaten = 0;
        currentLevel = 1;
        isNewRecord = false;
        tickIntervalMs = BASE_TICK_MS;
        scoreDisplay.textContent = '0';
        levelDisplay.textContent = '1';
        newRecordBanner.style.display = 'none';
        canvasContainer.classList.remove('hit-flash');

        spawnFood();
        setState('playing');
        lastTickTime = performance.now();
      }

      function togglePause() {
        if (gameState === 'playing') {
          setState('paused');
        } else if (gameState === 'paused') {
          initAudio();
          setState('playing');
          lastTickTime = performance.now();
        }
      }

      function triggerGameOver() {
        setState('gameover');
        playGameOverSound();

        // Hit flash animation
        canvasContainer.classList.add('hit-flash');
        setTimeout(() => {
          canvasContainer.classList.remove('hit-flash');
        }, 350);

        // Populate Game Over Modal
        finalScoreEl.textContent = score.toString();
        finalBestEl.textContent = highScore.toString();
        finalFoodEl.textContent = foodEaten.toString();
        finalLevelEl.textContent = currentLevel.toString();

        if (score > highScore) {
          highScore = score;
          localStorage.setItem(STORAGE_KEY_HIGHSCORE, highScore.toString());
          highscoreDisplay.textContent = highScore.toString();
          isNewRecord = true;
          newRecordBanner.style.display = 'block';
        } else {
          newRecordBanner.style.display = 'none';
        }
      }

      // --- DIRECTION & INPUT HANDLING WITH BUFFER QUEUE ---
      const OPPOSITE_DIRECTIONS = {
        UP: 'DOWN',
        DOWN: 'UP',
        LEFT: 'RIGHT',
        RIGHT: 'LEFT'
      };

      function requestDirection(newDir) {
        if (gameState !== 'playing') {
          if (gameState === 'title' || gameState === 'gameover') {
            startNewGame();
          }
          return;
        }

        // Determine reference direction: either the last queued direction or currentDirection
        const referenceDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : currentDirection;

        // Prevent opposite direction 180 suicide and duplicate consecutive presses
        if (newDir !== referenceDir && newDir !== OPPOSITE_DIRECTIONS[referenceDir]) {
          if (inputQueue.length < 2) {
            inputQueue.push(newDir);
            playTickSound();
          }
        }
      }

      // Keyboard Listener
      window.addEventListener('keydown', function (e) {
        // Space / Enter start or resume
        if (e.code === 'Space' || e.code === 'Enter') {
          if (gameState === 'title' || gameState === 'gameover') {
            e.preventDefault();
            startNewGame();
            return;
          } else if (gameState === 'playing' || gameState === 'paused') {
            if (e.code === 'Space') {
              e.preventDefault();
              togglePause();
              return;
            }
          }
        }

        // Pause Key (P)
        if (e.code === 'KeyP') {
          e.preventDefault();
          togglePause();
          return;
        }

        // Mute Key (M)
        if (e.code === 'KeyM') {
          e.preventDefault();
          toggleSound();
          return;
        }

        // Restart Key (R)
        if (e.code === 'KeyR') {
          e.preventDefault();
          startNewGame();
          return;
        }

        // Arrow and WASD keys
        switch (e.code) {
          case 'ArrowUp':
          case 'KeyW':
            e.preventDefault();
            requestDirection('UP');
            break;
          case 'ArrowDown':
          case 'KeyS':
            e.preventDefault();
            requestDirection('DOWN');
            break;
          case 'ArrowLeft':
          case 'KeyA':
            e.preventDefault();
            requestDirection('LEFT');
            break;
          case 'ArrowRight':
          case 'KeyD':
            e.preventDefault();
            requestDirection('RIGHT');
            break;
        }
      });

      // Clear input on blur
      window.addEventListener('blur', function () {
        inputQueue = [];
      });

      // Touch D-Pad Setup
      function setupDpadBtn(id, dir) {
        const btn = document.getElementById(id);
        if (!btn) return;

        const handlePress = (e) => {
          e.preventDefault();
          btn.classList.add('pressed');
          requestDirection(dir);
        };

        const handleRelease = (e) => {
          e.preventDefault();
          btn.classList.remove('pressed');
        };

        btn.addEventListener('pointerdown', handlePress);
        btn.addEventListener('pointerup', handleRelease);
        btn.addEventListener('pointercancel', handleRelease);
        btn.addEventListener('pointerleave', handleRelease);
      }

      setupDpadBtn('dpad-up', 'UP');
      setupDpadBtn('dpad-down', 'DOWN');
      setupDpadBtn('dpad-left', 'LEFT');
      setupDpadBtn('dpad-right', 'RIGHT');

      // Swipe Gestures on Canvas
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;

      canvas.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = performance.now();
        }
      }, { passive: true });

      canvas.addEventListener('touchend', function (e) {
        if (e.changedTouches.length === 1) {
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          const elapsed = performance.now() - touchStartTime;

          if (elapsed < 500) {
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);
            const minSwipe = 24;

            if (absX > minSwipe || absY > minSwipe) {
              if (absX > absY) {
                requestDirection(dx > 0 ? 'RIGHT' : 'LEFT');
              } else {
                requestDirection(dy > 0 ? 'DOWN' : 'UP');
              }
            } else if (gameState === 'title' || gameState === 'gameover') {
              startNewGame();
            }
          }
        }
      }, { passive: true });

      // Click button bindings
      startButton.addEventListener('click', startNewGame);
      resumeButton.addEventListener('click', togglePause);
      pauseRestartButton.addEventListener('click', startNewGame);
      playAgainButton.addEventListener('click', startNewGame);
      btnSound.addEventListener('click', toggleSound);
      btnPause.addEventListener('click', togglePause);
      btnRestart.addEventListener('click', startNewGame);

      // --- SIMULATION TICK ---
      function stepSimulation() {
        // Consume next buffered direction if available
        if (inputQueue.length > 0) {
          currentDirection = inputQueue.shift();
        }

        const head = snake[0];
        let nextX = head.x;
        let nextY = head.y;

        switch (currentDirection) {
          case 'UP': nextY -= 1; break;
          case 'DOWN': nextY += 1; break;
          case 'LEFT': nextX -= 1; break;
          case 'RIGHT': nextX += 1; break;
        }

        // Wall Collision Check
        if (nextX < 0 || nextX >= GRID_SIZE || nextY < 0 || nextY >= GRID_SIZE) {
          triggerGameOver();
          return;
        }

        // Self Collision Check (ignore the very tail because it will advance unless eating)
        const willEat = (nextX === food.x && nextY === food.y);
        const checkLength = willEat ? snake.length : snake.length - 1;
        for (let i = 0; i < checkLength; i++) {
          if (snake[i].x === nextX && snake[i].y === nextY) {
            triggerGameOver();
            return;
          }
        }

        // Move Snake
        const newHead = { x: nextX, y: nextY };
        snake.unshift(newHead);

        if (willEat) {
          score += POINTS_PER_FOOD;
          foodEaten++;
          scoreDisplay.textContent = score.toString();

          const prevSpeed = tickIntervalMs;
          tickIntervalMs = calculateCurrentSpeed(foodEaten);
          const isLevelUp = tickIntervalMs < prevSpeed;

          // Sound and particles
          playEatSound(isLevelUp);
          spawnParticles(food.x, food.y, isLevelUp ? '#ffb703' : '#00ff88');

          spawnFood();
        } else {
          snake.pop(); // Remove tail
        }
      }

      // --- CANVAS RENDERING (60 FPS LOOP) ---
      function render() {
        pulseAngle += 0.05;
        tongueTick++;

        // Clear Background with Dark Grid
        ctx.fillStyle = '#0a0e1a';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Subtle Grid Lines
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= CANVAS_WIDTH; x += TILE_SIZE) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, CANVAS_HEIGHT);
        }
        for (let y = 0; y <= CANVAS_HEIGHT; y += TILE_SIZE) {
          ctx.moveTo(0, y);
          ctx.lineTo(CANVAS_WIDTH, y);
        }
        ctx.stroke();

        // Subtle Outer Border Glow
        ctx.strokeStyle = 'rgba(0, 255, 136, 0.15)';
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, CANVAS_WIDTH - 2, CANVAS_HEIGHT - 2);

        // Render Food
        if (food) {
          const fx = (food.x + 0.5) * TILE_SIZE;
          const fy = (food.y + 0.5) * TILE_SIZE;
          const baseRadius = TILE_SIZE * 0.36;
          const pulse = Math.sin(pulseAngle * 3) * 2;
          const radius = Math.max(4, baseRadius + pulse);

          ctx.save();
          // Outer Glow
          ctx.shadowColor = '#ff2a6d';
          ctx.shadowBlur = 14 + pulse * 2;

          // Food Orb
          const foodGrad = ctx.createRadialGradient(fx - 2, fy - 2, 1, fx, fy, radius);
          foodGrad.addColorStop(0, '#ffffff');
          foodGrad.addColorStop(0.3, '#ff6584');
          foodGrad.addColorStop(0.8, '#ff2a6d');
          foodGrad.addColorStop(1, '#c0003c');

          ctx.fillStyle = foodGrad;
          ctx.beginPath();
          ctx.arc(fx, fy, radius, 0, Math.PI * 2);
          ctx.fill();

          // Diamond sparkle center
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(fx - 2, fy - 2, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Render Snake Segments
        if (snake.length > 0) {
          for (let i = snake.length - 1; i >= 0; i--) {
            const seg = snake[i];
            const px = seg.x * TILE_SIZE;
            const py = seg.y * TILE_SIZE;
            const isHead = (i === 0);
            const progress = i / Math.max(1, snake.length - 1);

            ctx.save();

            if (isHead) {
              // Glowing Head
              ctx.shadowColor = '#00ff88';
              ctx.shadowBlur = 12;

              const headGrad = ctx.createRadialGradient(
                px + TILE_SIZE / 2,
                py + TILE_SIZE / 2,
                2,
                px + TILE_SIZE / 2,
                py + TILE_SIZE / 2,
                TILE_SIZE / 2
              );
              headGrad.addColorStop(0, '#e6fff5');
              headGrad.addColorStop(0.5, '#00ff88');
              headGrad.addColorStop(1, '#00b359');

              ctx.fillStyle = headGrad;
              drawRoundedRect(ctx, px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4, 7);
              ctx.fill();

              // Snake Eyes
              ctx.shadowBlur = 0;
              ctx.fillStyle = '#080b14';
              let eye1X, eye1Y, eye2X, eye2Y;
              const eyeOffset = 6;
              const eyeRadius = 2.4;

              if (currentDirection === 'RIGHT') {
                eye1X = px + TILE_SIZE - 6; eye1Y = py + eyeOffset;
                eye2X = px + TILE_SIZE - 6; eye2Y = py + TILE_SIZE - eyeOffset;
              } else if (currentDirection === 'LEFT') {
                eye1X = px + 6; eye1Y = py + eyeOffset;
                eye2X = px + 6; eye2Y = py + TILE_SIZE - eyeOffset;
              } else if (currentDirection === 'UP') {
                eye1X = px + eyeOffset; eye1Y = py + 6;
                eye2X = px + TILE_SIZE - eyeOffset; eye2Y = py + 6;
              } else { // DOWN
                eye1X = px + eyeOffset; eye1Y = py + TILE_SIZE - 6;
                eye2X = px + TILE_SIZE - eyeOffset; eye2Y = py + TILE_SIZE - 6;
              }

              ctx.beginPath();
              ctx.arc(eye1X, eye1Y, eyeRadius, 0, Math.PI * 2);
              ctx.arc(eye2X, eye2Y, eyeRadius, 0, Math.PI * 2);
              ctx.fill();

              // Eye Highlights
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(eye1X + 0.6, eye1Y - 0.6, 1, 0, Math.PI * 2);
              ctx.arc(eye2X + 0.6, eye2Y - 0.6, 1, 0, Math.PI * 2);
              ctx.fill();

            } else {
              // Body Segments with smooth color transition from emerald to cyan
              const r = Math.round(0 + progress * 0);
              const g = Math.round(255 - progress * 50);
              const b = Math.round(136 + progress * 110);
              const segColor = `rgb(${r}, ${g}, ${b})`;

              ctx.shadowColor = 'rgba(0, 255, 136, 0.25)';
              ctx.shadowBlur = 6;
              ctx.fillStyle = segColor;

              const inset = 3;
              const segSize = TILE_SIZE - inset * 2;
              const cornerRadius = 5;
              drawRoundedRect(ctx, px + inset, py + inset, segSize, segSize, cornerRadius);
              ctx.fill();
            }

            ctx.restore();
          }
        }

        // Render Active Burst Particles
        updateAndDrawParticles();
      }

      function drawRoundedRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.moveTo(x + radius, y);
        context.lineTo(x + width - radius, y);
        context.quadraticCurveTo(x + width, y, x + width, y + radius);
        context.lineTo(x + width, y + height - radius);
        context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        context.lineTo(x + radius, y + height);
        context.quadraticCurveTo(x, y + height, x, y + height - radius);
        context.lineTo(x, y + radius);
        context.quadraticCurveTo(x, y, x + radius, y);
        context.closePath();
      }

      // --- MAIN ANIMATION & SIMULATION LOOP ---
      function gameLoop(now) {
        requestAnimationFrame(gameLoop);

        // Simulation update strictly on fixed tick intervals when playing
        if (gameState === 'playing') {
          const delta = now - lastTickTime;
          if (delta >= tickIntervalMs) {
            stepSimulation();
            lastTickTime = now;
          }
        }

        // Render at 60 FPS
        render();
      }

      // Initialize initial display
      initSnake();
      food = { x: 15, y: 10 };

      // Check for ?autostart=1
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('autostart') === '1') {
        startNewGame();
      }

      // Start rendering loop
      requestAnimationFrame(gameLoop);

    })();
  </script>
</body>
</html>
